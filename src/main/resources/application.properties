spring.application.name=swedemo

# 기본 프로파일: 로컬(H2 인메모리). Docker 실행 시 SPRING_PROFILES_ACTIVE=docker 로 오버라이드.
spring.profiles.active=local

# JPA (공통)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger (공통)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Judge (채점기 선택: fake=Mock, code=실제 실행). 기본 fake. docker 프로파일에서 code 로 오버라이드.
judge.mode=fake
judge.time-limit-ms=2000

# JWT (서명 키는 dev 기본값. 운영은 JWT_SECRET 환경변수로 반드시 교체)
jwt.secret=${JWT_SECRET:dev-secret-please-change-this-to-a-long-random-key-0123456789}
jwt.expiration-ms=3600000

# Batch (종료된 대회/시험 자동 마감·집계 주기)
batch.aggregate-interval-ms=60000
batch.initial-delay-ms=10000
