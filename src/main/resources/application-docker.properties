# ============================================================
# docker 프로파일 — 운영/번들 실행용 PostgreSQL DB
# 모든 접속 정보는 환경변수로 오버라이드 가능(기본값은 docker-compose 기준)
# ============================================================

# PostgreSQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/codingtest}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:codingtest}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:codingtest}

# JPA (docker)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# H2 console 비활성화
spring.h2.console.enabled=false

# Judge — 실제 코드 실행 채점 (이미지에 python3/javac 포함)
judge.mode=code
