# ============================================================
# 코딩 테스트 플랫폼 — 로컬 번들 실행 (app + PostgreSQL)
#   실행: docker compose up --build
#   종료: docker compose down        (데이터 유지)
#         docker compose down -v     (데이터 삭제)
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: codingtest-db
    environment:
      POSTGRES_DB: codingtest
      POSTGRES_USER: codingtest
      POSTGRES_PASSWORD: codingtest
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingtest -d codingtest"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: codingtest-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/codingtest
      SPRING_DATASOURCE_USERNAME: codingtest
      SPRING_DATASOURCE_PASSWORD: codingtest
    ports:
      - "8080:8080"

volumes:
  pgdata:
